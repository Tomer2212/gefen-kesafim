name: Process Scheduled Tasks

on:
  schedule:
    # Every 5 minutes (matches task-message-queue.yml's cadence) — evaluates tasks that were
    # created ahead of time with a future scheduled_for date, computing which schools actually
    # match the criteria once that date arrives and queuing/sending the first wave of messages.
    # Was hourly ('0 * * * *') until a live test with a same-day scheduled_for (e.g. 16:15)
    # showed that up to a ~59-minute gap between the scheduled time and actual evaluation is
    # confusing and erodes trust — 5-minute granularity matches user expectations without a
    # meaningful increase in GitHub Actions usage.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call process-scheduled-tasks endpoint
        run: |
          URL="${BACKEND_URL%/}"
          curl -sf -X POST "${URL}/tasks/process-scheduled-tasks" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            --max-time 60
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

name: Process Scheduled Tasks

on:
  schedule:
    # Every 15 minutes — evaluates tasks that were created ahead of time with a future
    # scheduled_for date, computing which schools actually match the criteria once that date
    # arrives and queuing/sending the first wave of messages.
    # Was briefly every 5 minutes, but live measurement showed GitHub Actions' own scheduling
    # throttling (not our cron expression) is the real bottleneck: even this workflow's own
    # unchanged 5-minute setting, and task-message-queue.yml's (also unrelated, never touched)
    # 5-minute cron, both drifted 10-30+ minutes between actual runs under real load — GitHub
    # does not guarantee punctual execution of frequent schedules. Since actual delivery already
    # has up to ~1 hour of slack communicated to the user (see the scheduling modal's copy in
    # TaskCreateWizard.jsx), asking GitHub for 12x more runs than it can honor bought nothing —
    # this interval only reduces wasted Actions minutes, not reliability either way.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call process-scheduled-tasks endpoint
        run: |
          URL="${BACKEND_URL%/}"
          curl -sf -X POST "${URL}/tasks/process-scheduled-tasks" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            --max-time 60
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

name: Send Due Meeting Reminders

on:
  schedule:
    # 03:00 UTC, Sunday-Thursday only (day-of-week: 0=Sunday ... 4=Thursday).
    # The endpoint computes "today" using Asia/Jerusalem time itself, so the
    # exact UTC firing time doesn't need to track DST.
    - cron: '0 3 * * 0-4'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminders endpoint
        run: |
          echo "URL length: ${#BACKEND_URL}"
          curl -s -o response.txt -w "HTTP_STATUS:%{http_code}\n" -X POST "${BACKEND_URL}/schools/meetings/send-due-reminders" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            --max-time 60
          echo "--- response body ---"
          cat response.txt
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

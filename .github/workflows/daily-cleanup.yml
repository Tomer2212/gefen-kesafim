name: Daily Storage / Run-State Cleanup

on:
  schedule:
    # Once a night (01:30 UTC). Deletes source files of checks older than 24 months and
    # run_states rows older than 120 days — used to run on every backend startup instead.
    - cron: '30 1 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily cleanup endpoint
        run: |
          URL="${BACKEND_URL%/}"
          curl -sf -X POST "${URL}/maintenance/daily-cleanup" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            --max-time 300
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
